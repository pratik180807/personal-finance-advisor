services:
  - type: web
    name: personal-finance-advisor
    env: python
    region: oregon
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn run:app"
    envVars:
      - key: FLASK_ENV
        value: production
      - key: AUTO_SEED_DEMO
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: finance-advisor-db
          property: connectionString

databases:
  - name: finance-advisor-db
    region: oregon
    plan: free
    databaseName: finance_advisor
    user: finance_user
